[project]
name = "tunneld"
version = "0.3.1"
description = "Config-driven SSH tunnel manager: one SSH connection per tunnel, many -L/-D/-R forwards, auto-reconnect."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "goodboys-ai" }]
keywords = ["ssh", "tunnel", "autossh", "port-forwarding", "socks5", "daemon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = [
  "pydantic>=2.7,<3",
  "tomli>=2; python_version < '3.11'",
  "typer>=0.12",
  "rich>=13",
]

[project.urls]
Homepage = "https://github.com/goodboys-ai/tunneld"
Repository = "https://github.com/goodboys-ai/tunneld"
Issues = "https://github.com/goodboys-ai/tunneld/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=5",
  "pytest-timeout>=2",
  "pre-commit>=3",
  "pyright>=1.1.380",
  "ruff>=0.6",
]

[project.scripts]
tunneld = "tunneld.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tunneld"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B", "PERF", "RUF", "UP", "SIM"]
ignore = ["D105", "D107", "BLE001", "B008", "UP007", "UP045"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=src/tunneld --cov-report=term-missing"
timeout = 60
timeout_method = "thread"
