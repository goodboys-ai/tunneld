[project]
name = "tunneld"
version = "0.1.0"
description = "Config-driven SSH tunnel manager: one ssh connection per host, many -L/-D/-R forwards, auto-reconnect."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7,<3",
  "tomli>=2; python_version < '3.11'",
  "typer>=0.12",
  "rich>=13",
]

[project.urls]
Homepage = "https://github.com/goodboys-ai/tunneld"
Repository = "https://github.com/goodboys-ai/tunneld"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.6",
]

[project.scripts]
tunneld = "tunneld.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tunneld"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
